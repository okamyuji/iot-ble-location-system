# 公開から3日未満の版は提案しない（pnpm の minimumReleaseAge と同じ待機）。minor と patch は major と別の PR にまとめ、major で CI が落ちても残りを取り込めるようにする
version: 2
updates:
  - package-ecosystem: pub
    directories:
      - "/flutter-app"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: gradle
    directories:
      - "/flutter-app/android"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: maven
    directories:
      - "/server"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
